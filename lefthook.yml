pre-commit:
  commands:
    biome:
      run: npx biome check --write --error-on-warnings --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    depcruise:
      run: npm run depcruise
    licence:
      run: npm run licence
    licence-deps:
      run: npm run licence:deps
    agents:
      run: npm run agents:check
    names:
      run: npm run names:check
    portability:
      run: npm run portability:check

pre-push:
  commands:
    typecheck:
      glob: "**/*.{ts,tsx,mjs,cjs,json}"
      run: npm run typecheck

commit-msg:
  commands:
    names:
      run: node scripts/names-check.mjs message {1}
